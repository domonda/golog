name: Run Gosec
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      # gosec only checks a nested module's packages when run from inside that
      # module, so scan each released module from its own directory, using the
      # gosec version pinned in tools/go.mod. Keep the list in sync with the
      # released modules (MODULE_PATHS in tag-version.sh).
      - name: Run Gosec Security Scanner
        run: |
          for dir in . goslog logsentry; do
            (cd "$dir" && go tool gosec ./...)
          done
